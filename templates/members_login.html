<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Members Login - DigitalHMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
        }

        .login-container {
            width: 380px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #2E4057;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .member-type {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: white;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2E4057;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #243447;
        }

        .register-link {
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #2E4057;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
        }

        .message {
            color: #c62828;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Members Login</h1>

        <p class="subtitle">
            Login to your DigitalHMS member account
        </p>

        {% if messages %}
            {% for message in messages %}
                <p class="message">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}


        <form method="POST">

            {% csrf_token %}

            <!-- Member Type -->
            <select
                name="member_type"
                class="member-type"
                required
            >
                <option value="">Select Member Type</option>
                <option value="HOSPITAL">Hospital</option>
                <option value="DOCTOR">Doctor</option>
                <option value="HEALTH_WORKER">Health Worker</option>
                <option value="MEDICAL_SHOP">Medical Shop</option>
                <option value="BLOOD_BANK">Blood Bank</option>
            </select>

            <!-- Username -->
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <!-- Password -->
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

            <a href="{% url 'members_forgot_password' %}"
                  style="display:block; margin-top:15px; color:#2E4057; text-decoration:none; font-weight:bold;">
                        Forgot Password?
             </a>

        </form>

        <!-- Registration Link -->
        <div class="register-link">

            Don't have a member account?

            <a href="{% url 'members_register' %}">
                Register
            </a>

        </div>

        <!-- Back to Home -->
        <a
            href="{% url 'home' %}"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>
