<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Login - DigitalHMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f5f0;
        }

        .login-container {
            width: 380px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #1a7f6e;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #1a7f6e;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #146657;
        }

        .register-link {
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #1a7f6e;
            text-decoration: none;
            font-weight: bold;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #777;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Patient Login</h1>

        <p class="subtitle">
            Login to access your DigitalHMS account
        </p>

        <!-- Patient Login Form -->
        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <!-- Registration Link -->
        <div class="register-link">
            Don't have an account?
            <a href="{% url 'patient_register' %}">
                Register
            </a>
        </div>

        <!-- Back to Home -->
        <a href="{% url 'home' %}" class="back-link">
            ← Back to Home
        </a>

    </div>

</body>

</html>
