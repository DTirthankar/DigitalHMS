<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - DigitalHMS</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0859e599;
        }

        .forgot-container {
            width: 380px;
            margin: 100px auto;
            padding: 35px;
            background: rgb(255, 255, 255);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #1a7f6e;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .patient-selection {
            text-align: left;
            margin-top: 15px;
            padding: 15px;
            background: #f5f8f7;
            border-radius: 6px;
        }

        .patient-selection-title {
            font-weight: bold;
            color: #444;
            margin-bottom: 10px;
        }

        .patient-option {
            display: block;
            margin: 12px 0;
            color: #cb12d1;
            cursor: pointer;
        }

        .patient-option input {
            width: auto;
            margin-right: 8px;
        }

        .continue-button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #76d8da;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-button:hover {
            background: #146657;
        }

        .login-link {
            display: block;
            margin-top: 20px;
            color: #1a7f6e;
            text-decoration: none;
            font-weight: bold;
        }

        .message {
            color: #c62828;
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <h1>Forgot Password?</h1>

        <p class="subtitle">
            Enter your registered mobile number or email ID
        </p>

        {% if messages %}
            {% for message in messages %}
                <p class="message">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <!-- Mobile Number or Email -->
            <input
                type="text"
                name="identifier"
                placeholder="Mobile Number or Email ID"
                value="{{ request.POST.identifier }}"
                required
            >

            <!-- Patient Selection -->
            {% if patients %}

                <div class="patient-selection">

                    <div class="patient-selection-title">
                        Select Patient
                    </div>

                    {% for patient in patients %}

                        <label class="patient-option">

                            <input
                                type="radio"
                                name="patient_id"
                                value="{{ patient.id }}"
                                required
                            >

                            {{ patient.full_name }}

                        </label>

                    {% endfor %}

                </div>

            {% endif %}

            <button type="submit" class="continue-button">
                Continue
            </button>

        </form>

        <a href="{% url 'patient_login' %}" class="login-link">
            ← Back to Login
        </a>

    </div>

</body>

</html>
